name: build-openmuse-ios-unsigned

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 240
    env:
      EXPO_PUBLIC_API_URL: http://tt.52hy.eu.org:8787
    steps:
      - name: Checkout OpenMuse
        uses: actions/checkout@v4
        with:
          repository: CopilotKit/openmuse
          ref: main

      - name: Patch bundle identifier
        run: |
          python3 - << 'PYEOF'
          import json
          p = 'apps/mobile/app.json'
          d = json.load(open(p))
          d['expo']['ios']['bundleIdentifier'] = 'app.maroon1835.nance8519'
          json.dump(d, open(p, 'w'), indent=2)
          print('bundleIdentifier ->', d['expo']['ios']['bundleIdentifier'])
          PYEOF

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Expo prebuild (iOS)
        working-directory: apps/mobile
        run: npx expo prebuild -p ios --no-install

      - name: Pod install
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build unsigned Release app
        working-directory: apps/mobile
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          echo "workspace: $WS"
          xcodebuild -workspace "$WS" -scheme OpenMuse -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package raw app
        working-directory: apps/mobile
        run: |
          APP=$(ls -d build/dd/Build/Products/Release-iphoneos/*.app | head -1)
          echo "app: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -9 -y -r ../OpenMuse-raw-app.zip Payload > /dev/null
          ls -la ../OpenMuse-raw-app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMuse-raw-app
          path: apps/mobile/OpenMuse-raw-app.zip
          retention-days: 7
